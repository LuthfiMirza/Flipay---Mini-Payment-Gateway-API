name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Validate Go Project
    runs-on: ubuntu-latest

    steps:
      # Checkout downloads the repository into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-go installs and caches Go dependencies for faster CI runs.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      # gofmt check fails if a file is not formatted, but does not rewrite code in CI.
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build ./...

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flipay
      POSTGRES_PASSWORD: flipay
      POSTGRES_DB: flipay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
volumes:
  postgres_data:
